for(let p=1;p<=np;p++){const tcn=await(await pdf.getPage(p)).getTextContent(),rows=[];
tcn.items.filter(i=>i.str.trim()).forEach(i=>{const y=i.transform[5],x=i.transform[4],h=Math.abs(i.transform[3])||i.height||0;let r=rows.find(r=>Math.abs(r.y-y)<3);if(!r)rows.push(r={y,c:[]});r.c.push({x,s:i.str.trim(),w:i.width||0,h})});
rows.sort((a,b)=>b.y-a.y).forEach(r=>{r.c.sort((a,b)=>a.x-b.x);let s='';r.c.forEach((c,k)=>{if(k){const g=c.x-(r.c[k-1].x+r.c[k-1].w);s+=g>CFG.COL_GAP?' | ':' '}s+=c.s});out.push(s);if(p===1)p1.push({s,h:Math.max(...r.c.map(c=>c.h))})})}
const big=Math.max(0,...p1.map(r=>r.h));return{lines:out,title:p1.filter(r=>r.h>=big*.9&&r.s.length>2).map(r=>r.s).join(' ')}}
let lastPdf=null;
async function importPdf(f){if(!f)return;if(!/pdf$/i.test(f.name)&&f.type!=='application/pdf')return toast('Choose a PDF file.');lastPdf=f;
modal(`<h3 style="font-size:24px">Reading ${esc(f.name)}</h3><p class="mu" style="margin:10px 0 16px">Pulling out the exercises…</p><div class="prog"><i></i></div>`);
try{if(!window.pdfjsLib)throw{message:'The PDF reader did not load. Check your connection and reload.'};const r=await pdfLines(f);draft=parseLines(r.lines,r.title,f.name);modal(editH())}
catch(e){draft=null;modal(`<h3 style="font-size:24px">Could not read that PDF</h3><p class="mu" style="margin:10px 0 18px">${esc(e&&e.message||'Something went wrong. Try again.')}</p><div class="acts"><button class="btn tape" data-a="newW">Add manually</button><button class="btn ghost" data-a="aiScan">Try with Claude</button><button class="btn ghost" data-a="close">Close</button></div>`)}}
async function aiPdf(f){if(!f)return;if(!/pdf$/i.test(f.name)&&f.type!=='application/pdf')return toast('Choose a PDF file.');
modal(`<h3 style="font-size:24px">Reading ${esc(f.name)}</h3><p class="mu" id="ps" style="margin:10px 0 16px">Opening the file…</p><div class="prog"><i></i></div>`);const st=t=>{const e=$('#ps');e&&(e.textContent=t)};
try{if(!window.pdfjsLib)throw{message:'The PDF reader did not load. Check your connection and reload.'};
const sm=window.claude&&await claude.use('sample');if(!sm)throw{message:'Claude is not available in this view. Open the published link while signed in to claude.ai.'};
const pdf=await pdfjsLib.getDocument({data:await f.arrayBuffer()}).promise,np=Math.min(pdf.numPages,CFG.MAX_PAGES);let text='',imgs=[],ci=false;try{ci=!!(await sm.limits()).images}catch(e){}
for(let p=1;p<=np;p++){st(`Reading page ${p} of ${np}…`);const pg=await pdf.getPage(p),tc=await pg.getTextContent();text+=`\n--- page ${p} ---\n`+tc.items.map(i=>i.str+(i.hasEOL?'\n':' ')).join('');
if(ci&&imgs.length<CFG.MAX_IMG){const vp=pg.getViewport({scale:CFG.IMG_SCALE}),c=document.createElement('canvas');c.width=vp.width;c.height=vp.height;await pg.render({canvasContext:c.getContext('2d'),viewport:vp}).promise;imgs.push(await new Promise(r=>c.toBlob(r,'image/jpeg',.72)))}}
st('Claude is building your list…');const o=await sm(PROMPT+text.slice(0,CFG.TEXT_CAP),{cache:false,...(imgs.length?{images:imgs}:{})}),a=o.text.indexOf('{'),z=o.text.lastIndexOf('}');
let j;try{j=JSON.parse(o.text.slice(a,z+1))}catch(e){throw{message:'Claude could not make a list from that file. Try again or add it manually.'}}
draft=norm(j,f.name);draft.ai=1;modal(editH())}
catch(e){draft=null;modal(`<h3 style="font-size:24px">Could not read that PDF</h3><p class="mu" style="margin:10px 0 18px">${esc(e&&e.message||'Something went wrong. Try again.')}</p><div class="acts"><button class="btn tape" data-a="newW">Add manually</button><button class="btn ghost" data-a="close">Close</button></div>`)}}
// coach
async function ask(q){if(!q.trim())return;S.coach.push({m:1,t:q},{m:0,t:''});const last=S.coach[S.coach.length-1],up=()=>{const e=$('#cm');if(e){e.innerHTML=coachH();e.scrollTop=e.scrollHeight}};up();
try{const sm=window.claude&&await claude.use('sample');if(!sm)throw 0;const h=S.coach.slice(-CFG.COACH_HISTORY-1,-1).map(x=>(x.m?'User: ':'Coach: ')+x.t).join('\n'),r=S.logs.slice(-8).map(l=>l.d+' '+l.n+(l.total?` (${l.done}/${l.total} sets)`:'')).join('; ')||'none yet';
await sm(`You are the coach inside Rung, a calisthenics workout tracker. Athlete: ${S.user}. Their workouts: ${S.workouts.map(w=>w.n+' ['+w.sessions.map(s=>s.n+': '+s.ex.map(e=>e.n+' '+e.d).join(', ')).join(' | ')+']').join('; ')}. Recent sessions: ${r}. Sessions per area, last ${CFG.REC_DAYS} days: ${JSON.stringify(counts())}. Reply in plain text, friendly and concrete, under ${CFG.COACH_WORDS} words, no headers. Use **bold** sparingly. Mention a doctor only for real pain or injury.\n\n${h}\nCoach:`,{cache:false,onText:({text})=>{last.t=text;up()}});save()}
catch(e){last.t=e&&e.code==='rate_limited'?'Too many questions at once. Give it a minute.':'The coach is not available right now. Try again in a moment.';up()}}
// actions
const A={go:v=>{view=v;paint();scrollTo(0,0)},
login:()=>{const n=$('#nm').value.trim();if(!S.workouts)S={user:n||'Athlete',logs:[],workouts:[starter()],coach:[]};else S.user=n||S.prev||'Athlete';save();enter()},
out:()=>{S.prev=S.user;S.user=null;save();location.reload()},
openw:openW,aiScan:()=>lastPdf&&aiPdf(lastPdf),run:openRun,close:closeM,skipR:()=>{clearInterval(rt);$('#rest').hidden=true},
tick:(v,t)=>{const[i,j]=v.split('.').map(Number);run.t[i][j]^=1;t.classList.toggle('on',!!run.t[i][j]);$('#rc').textContent=run.t.flat().filter(Boolean).length;if(run.t[i][j])rest()},
fin:()=>{const w=S.workouts.find(x=>x.id===run.w),s=w.sessions[run.s],f=run.t.flat();logS({k:s.k,n:s.n,done:f.filter(Boolean).length,total:f.length});closeM()},
saveW:v=>{const w=LIB.find(x=>x.id===v);S.workouts.unshift({id:'s'+v,n:w.n,sub:`${w.l} · ${w.m} min`,sessions:[{n:w.n,k:w.k,ex:w.ex.map(X)}]});save();toast('Added to My workouts.');paint()},
rm:v=>{if(!confirm('Delete this workout?'))return;S.workouts=S.workouts.filter(w=>w.id!==v);save();closeM();paint();toast('Workout deleted.')},
delL:v=>{S.logs=S.logs.filter(l=>l.id!==v);save();paint()},
newW:()=>{draft={n:'',sub:'',split:null,sessions:[{n:'Session 1',k:'full',ex:[{n:'',d:''}]}]};modal(editH())},
edit:v=>{draft=JSON.parse(JSON.stringify(S.workouts.find(w=>w.id===v)));modal(editH())},
aE:v=>{draft.sessions[+v].ex.push({n:'',d:''});modal(editH())},dE:v=>{const[i,j]=v.split('.').map(Number);draft.sessions[i].ex.splice(j,1);modal(editH())},
aS:()=>{draft.sessions.push({n:'Session '+(draft.sessions.length+1),k:'full',ex:[{n:'',d:''}]});modal(editH())},dS:v=>{draft.sessions.splice(+v,1);draft.split=null;modal(editH())},
saveD:()=>{delete draft.imp;delete draft.ai;draft.sessions.forEach(s=>s.ex=s.ex.filter(e=>e.n.trim()));draft.sessions=draft.sessions.filter(s=>s.n.trim());if(!draft.n.trim())return toast('Give the workout a name.');if(!draft.sessions.length)return toast('Add at least one session.');
if(draft.id)S.workouts=S.workouts.map(w=>w.id===draft.id?draft:w);else{draft.id='w'+Date.now();S.workouts.unshift(draft)}save();closeM();paint();toast('Workout saved.')},
ask:v=>{view!=='coach'&&A.go('coach');ask(v)},askIn:()=>{const i=$('#cc'),t=i.value;i.value='';ask(t)},clearC:()=>{S.coach=[];save();paint()}};
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(t&&A[t.dataset.a])A[t.dataset.a](t.dataset.v,t);if(e.target.id==='md'&&!draft)closeM()});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.dataset.enter)A[e.target.dataset.enter]();if(e.key==='Escape'&&!draft)closeM()});
document.addEventListener('input',e=>{const d=e.target.dataset,v=e.target.value;if(!draft||!d.f)return;const s=draft.sessions[+d.s];({t:()=>draft.n=v,sn:()=>s.n=v,sk:()=>s.k=v,en:()=>s.ex[+d.e].n=v,ed:()=>s.ex[+d.e].d=v})[d.f]()});
document.addEventListener('change',e=>{if(e.target.id==='pf'){importPdf(e.target.files[0]);e.target.value=''}else if(e.target.dataset.f==='sk'&&draft)draft.sessions[+e.target.dataset.s].k=e.target.value});
['dragover','drop'].forEach(n=>document.addEventListener(n,e=>{const d=e.target.closest&&e.target.closest('.drop');if(!d)return;e.preventDefault();d.classList.toggle('over',n==='dragover');if(n==='drop')importPdf(e.dataTransfer.files[0])}));
document.addEventListener('dragleave',e=>{const d=e.target.closest&&e.target.closest('.drop');d&&d.classList.remove('over')});
function enter(){$('#app').hidden=false;paint();const l=$('#login');if(l){l.classList.add('out');setTimeout(()=>l.remove(),950)}}
if(S.user&&S.workouts){$('#login').remove();enter()}
</script></body></html>
